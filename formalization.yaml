fidelity:
  divergences: >-
    The fine grid uses disjoint closed boxes of half the cell side, ordered by corner height.
    The volume constants absorb this shrinkage. The fine mesh resolves both nonzero triple
    sums and nonzero site heights. A.6 uses an injection into the first difference set
    times the remaining two pieces. The final bound counts sites by Set.ncard. Half-ball density is expressed by its divergent
    sequence criterion. A.1 supplies a finite patch constant and B.1 supplies the translated-difference
    estimate needed for finite generation. The sharper numerical A.1 constant and the general B.1
    single-seminorm statement are outside scope. B.4 derives bounded coefficients by finite
    character recurrences and compactness of translated lattice positions, then uses inclusion–exclusion
    and the finite dual-class argument to recover coefficients at all sites.
automation:
