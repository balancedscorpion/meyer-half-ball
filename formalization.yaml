version: v0.4
project:
  name: A geometric local count from an ordered patch bound and a half-ball count
  description: >-
    Let B be locally finite in a positive-dimensional Euclidean space. Suppose a common
    finite constant bounds the total Lebesgue volume of each admissible ordered family of
    patches at every site. If the number of sites in origin-centred closed half-balls
    of radii S is bounded by a constant times S to the ambient dimension along a sequence
    tending to infinity, then one integer bounds the number of sites in the corresponding
    closed half-space in every open unit ball. The ball centre is arbitrary, and distinct
    sites may be arbitrarily close.
  authors: [Jamie Martin]
  responsible_maintainers: [Jamie Martin]
  license: Apache-2.0
classification:
  arxiv: [math.CA, math.CO]
  msc2020: [42B10, 11B30]
