version: v0.4
project:
  name: Independent physical and spectral half-ball counts characterize finite sums of lattice combs
  description: >-
    A crystalline tempered distribution on a positive-dimensional Euclidean space is a finite sum
    of translated and modulated full-rank lattice Dirac combs with complex coefficients if and only
    if its support and spectrum each admit a polynomial count of degree equal to the dimension in one
    closed half-ball along divergent radii. The two unit normals and the two radius sequences may be
    chosen independently. The geometric result gives a single bound on the number of sites of a
    locally finite set in the measured half-space in every open unit ball, from its ordered
    patch-volume bound and its half-ball count. Distinct sites may be arbitrarily close.
  authors: [Jamie Martin]
  responsible_maintainers: [Jamie Martin]
  license: Apache-2.0
classification:
  arxiv: [math.CA, math.CO]
  msc2020: [42B10, 11B30]
