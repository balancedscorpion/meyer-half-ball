  notes: The intentional Challenge placeholder is excluded from the proof-development counts.
fidelity:
  divergences: >-
    The fine grid uses disjoint closed boxes of half the cell side, ordered by corner height.
    The volume constants absorb this shrinkage. The fine mesh resolves both nonzero triple
    sums and nonzero site heights. A.6 uses an injection into the first difference set
    times the remaining two pieces. The final bound counts sites by Set.ncard.
automation:
  methods:
    - method: agent
      tool_setup: OpenAI Codex, Lean 4, Lake and Mathlib
      notes: Codex wrote the proof under the author's task specification, integrated the BSG module and ran the verification commands.
review:
  status: self-assessed
  notes: The axiom audit checks the exported A.3 and the A.4–A.6 proof chain. Theorem 1.1 is outside this submission.
