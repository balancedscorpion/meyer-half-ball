    authors: [Jamie Martin]
    type: paper
    relationship: formalizes
    location: Manuscript dated 23 November 2026, Theorem A.3 and Lemmas A.4–A.6, pages 19–22.
    note: The supplied PDF has SHA-256 2b07f0512d57a9a504db93931e3c1ad07280a2ed1568c6b891337dd43a6610bb.
